[build]
  publish = "."
  functions = "netlify/functions"

# Make /api/products a clean alias for the function URL
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

[[redirects]]
  from = "/api/submit-order"
  to = "/.netlify/functions/submit-order"
  status = 200
